name: pso2_character_manager
description: "PSO2 Character Data Manager - Local library for PSO2 character files."
publish_to: 'none'
version: 1.4.1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # File picker (character files + images)
  file_picker: ^8.1.2

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.3

  # UUID for unique IDs
  uuid: ^4.4.2

  # Drag and drop files from Windows Explorer
  desktop_drop: ^0.4.4

  # Color wheel picker
  flutter_colorpicker: ^1.1.0

  # Zip/archive for .pso2char bundle
  archive: ^3.6.1

  # Clipboard image support
  pasteboard: ^0.5.0

  # Custom window title bar
  window_manager: ^0.4.3

  # App update checker
  http: ^1.2.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive code generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
