name: pso2_character_manager
description: "PSO2 Character Data Manager - Local library for PSO2 character files."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  provider: ^6.1.2

  # File picker (character files + images)
  file_picker: ^8.1.2

  # Path utilities
  path: ^1.9.0
  path_provider: ^2.1.3

  # UUID for unique IDs
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Hive code generator
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
